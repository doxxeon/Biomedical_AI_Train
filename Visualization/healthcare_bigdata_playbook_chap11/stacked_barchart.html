<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="X-UA-Compatible" content="ie=edge" />
  <title>Stacked Bar Chart</title>

</head>

<body>

  <div style="width: 900px; height: 900px;">
    <!--차트가 그려지는 부분-->
    <canvas id="myChart"></canvas>
  </div>

  <!-- chart.js 파일 -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <script type="module">
    // Import the functions you need from the SDKs you need
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.16.0/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/9.16.0/firebase-database.js";
    // TODO: Add SDKs for Firebase products that you want to use
    // https://firebase.google.com/docs/web/setup#available-libraries

    // Your web app's Firebase configuration
    // For Firebase JS SDK v7.20.0 and later, measurementId is optional
    const firebaseConfig = {
        apiKey: "AIzaSyDiOGshVJA556CM5x4DohAXzowUvdvixow",
        authDomain: "healthcare-bigdata-chap11.firebaseapp.com",
        databaseURL: "https://healthcare-bigdata-chap11-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "healthcare-bigdata-chap11",
        storageBucket: "healthcare-bigdata-chap11.firebasestorage.app",
        messagingSenderId: "504054254868",
        appId: "1:504054254868:web:751df9fecf769680ad4601",
        measurementId: "G-BBH29EKPES"
    };

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);

    // Initialize Realtime Database and get a reference to the service
    const database = getDatabase(app);

    export const deviceDayRef = ref(database, "/stackedbar");

    onValue(deviceDayRef, (snapshot) => {
      const data = snapshot.val();
      data.forEach((child) => {
        addData(myChart, child.deviceId, child.absence, child.not_act, child.act, child.caution, child.fall);
      });

      myChart.update();
    });

    // 차트에 데이터를 동적으로 추가함
    function addData(chart, label, absence, not_act, act, caution, fall) {
      chart.data.labels.push(label);
      chart.data.datasets[0].data.push(absence);
      chart.data.datasets[1].data.push(not_act);
      chart.data.datasets[2].data.push(act);
      chart.data.datasets[3].data.push(caution);
      chart.data.datasets[4].data.push(fall);
    }

  </script>

  <script type="text/javascript">

    const data = {
      datasets: [
        {
          label: '부재',
          backgroundColor: 'lightgray',
        },
        {
          label: '미활동',
          backgroundColor: 'silver',
        },
        {
          label: '활동',
          backgroundColor: 'darkgray',
        },
        {
          label: '주의',
          backgroundColor: 'gray',
        },
        {
          label: '낙상',
          backgroundColor: 'dimgray',
        }
      ]
    };

    var context = document.getElementById('myChart').getContext('2d');
    var myChart = new Chart(context, {
      type: 'bar', // 차트의 형태
      data: data,
      options: {
        responsive: true,
        plugins: {
          title: {
            display: true,
            text: (ctx) => 'StackedBar Activity Status',
          },
        },
        scales: {
          y: {
            stacked: true,
          },
          x: {
            stacked: true,
          }
        },
      }
    });
  </script>

</body>
</html>
